name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q scripts panel tests
      - name: Bash syntax
        run: |
          bash -n install.sh
          for script in scripts/*.sh; do
            bash -n "$script"
          done
